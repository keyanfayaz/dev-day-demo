<style>
:root{color-scheme:dark;--background:#191919;--surface:#292929;--text:#f5f5f3;--subtle:#a5a5a0;--blue:#3465f3;--accent:#f5bc58}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--background);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button:disabled{opacity:.28;cursor:default}
.app{height:100dvh;max-width:1160px;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;align-items:center;justify-content:space-between;padding:25px 48px 23px;border-bottom:1px solid #303030;gap:24px}
.identity{display:flex;align-items:center;gap:15px}.avatar{display:block;width:50px;height:50px;object-fit:contain;border-radius:50%;flex-shrink:0}.name{font-size:26px;font-weight:600;letter-spacing:-.5px}.header-right{display:flex;align-items:center;gap:23px}.quiet{background:none;border:0;color:var(--subtle);padding:9px 0;font-size:14px}.quiet:hover{color:var(--text)}
#conversation{min-height:0;overflow:auto;padding:36px 48px 28px;overscroll-behavior:contain;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#454545 transparent;cursor:pointer}
.date{display:block;font-size:14px;color:#8e8e86;margin:0 auto 32px;text-align:center}
.chapter-date{margin-top:38px}.chapter-date.new{animation:arrive .32s ease-out both}
.message{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 26px}.message.me{align-items:flex-end}.message.with-work{margin-bottom:12px}.speaker{font-size:13px;color:var(--subtle);margin:0 16px 9px;letter-spacing:.2px}.bubble{position:relative;font-size:clamp(22px,2.2vw,29px);line-height:1.42;letter-spacing:-.35px;padding:20px 25px;border-radius:24px;max-width:89%;background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}.me .bubble{background:var(--blue);border-bottom-right-radius:8px}.homie .bubble{border-bottom-left-radius:8px}.special .bubble{font-size:clamp(25px,2.7vw,35px);font-weight:500;padding:23px 26px}.activity{font-size:15px;line-height:1.35;color:#dadad4;display:inline-flex;align-items:center;gap:10px;max-width:100%;margin:0 0 12px;padding:9px 13px;border:1px solid #393933;border-radius:10px}.activity:before{content:'◌';font-size:20px;line-height:1;color:#dadad4;flex-shrink:0}.activity:after{content:'';width:7px;height:7px;margin-left:4px;border-radius:50%;background:#3983ff;flex-shrink:0}
.new .bubble,.new .speaker,.new .activity{animation:arrive .32s cubic-bezier(.2,.8,.2,1) both}@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.activity{margin:0}.activity:before{display:none}.work-row{margin:0 0 12px}.work-status{display:block;width:16px;height:16px;flex-shrink:0;line-height:16px;font-size:17px;text-align:center}.activity.running .work-status{border:1.5px solid #55554d;border-top-color:#eeeeea;border-radius:50%;animation:work-spin .85s linear infinite}.activity.complete .work-status{color:#3983ff}@keyframes work-spin{to{transform:rotate(360deg)}}
.speaker{display:flex;align-items:center;gap:7px;min-height:24px}.speaker-avatar{width:24px;height:24px;object-fit:contain;border-radius:50%;flex-shrink:0}.connection{font-size:16px;color:#b8b8ae;text-align:center;margin:36px 0 27px}.connection.new{animation:arrive .32s ease-out both}
.mention{color:inherit;font-weight:500;text-decoration:underline;text-decoration-color:#ffffffa6;text-underline-offset:3px;text-decoration-thickness:1px}
.reaction{position:absolute;top:-15px;right:16px;background:#393a35;border:2px solid var(--background);border-radius:18px;padding:5px 9px;font-size:19px;line-height:1;white-space:nowrap}
.typing .bubble{min-width:100px;min-height:68px;padding:24px 28px;display:flex;gap:6px;align-items:center}.typing span.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8e8e87;animation:type .7s ease-in-out infinite}.typing span.dot:nth-child(2){animation-delay:.1s}.typing span.dot:nth-child(3){animation-delay:.2s}@keyframes type{0%,60%,100%{opacity:.45;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
footer{padding:17px 48px 24px;background:var(--background)}.composer{display:flex;gap:13px;align-items:center;max-width:1064px;margin:auto}.back{width:42px;height:42px;background:transparent;border:0;color:#93938b;font-size:23px;flex-shrink:0}.next{flex:1;border:1px solid #35352f;border-radius:28px;background:transparent;color:#777870;min-height:57px;padding:14px 23px;text-align:left;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:15px;transition:background .15s,border-color .15s}.next:hover{background:#ffffff03;border-color:#4c4c43}.next .arrow{color:var(--accent);opacity:.65;font-size:22px;line-height:1}
.notice{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#31332a;border:1px solid #62664e;border-radius:12px;padding:13px 18px;max-width:90vw;font-size:15px;z-index:12}
@media(min-width:1600px){.app{max-width:1320px}.bubble{font-size:32px;max-width:90%}.special .bubble{font-size:39px}}
@media(max-width:720px){header{padding:19px 22px 18px;gap:12px}.name{font-size:24px}.identity{gap:10px}.avatar{width:44px;height:44px}.header-right{gap:14px}.full-screen{display:none}#conversation{padding:27px 20px 21px}.bubble{max-width:95%;font-size:20px;padding:16px 20px;border-radius:22px}.special .bubble{font-size:24px;padding:20px}.message{margin-bottom:23px}.speaker{margin-bottom:7px}.activity{font-size:13px;padding:8px 11px;gap:8px}.connection{font-size:14px;margin:28px 0 23px}footer{padding:13px 18px 17px}.composer{gap:4px}.next{font-size:17px;min-height:52px;padding:12px 18px}.back{width:35px}}
@media(max-width:520px){header{padding-left:18px;padding-right:18px}.quiet{padding:5px 0}}
@media(prefers-reduced-motion:reduce){#conversation{scroll-behavior:auto}.new .bubble,.new .speaker,.new .activity,.connection.new,.chapter-date.new{animation:none}.typing span.dot,.activity.running .work-status{animation:none}}
@media print{html,body{height:auto;background:white;color:black}.app{height:auto;display:block}header{border-color:#ddd}.header-right,footer,.typing{display:none!important}#conversation{overflow:visible;cursor:auto}.bubble{break-inside:avoid;background:#eee;color:black;max-width:89%}.me .bubble{background:#e8efff;color:black}.speaker,.activity,.date{color:#555}}

ypingBefore":true},{"kind":"work","activity":"Inspect Raidio mini readiness","workId":"work-8","hideSpeaker":true},{"kind":"work-complete","completesWork":"work-8"},{"who":"homie","text":"PR21 is merged into beta. It includes PR17’s work, so GitHub marked that merged too; PR18’s code is included, though its PR remains open.\n\nGitHub automatically started checks for both beta and the existing beta-to-main PR. I’m watching those; nothing has been released to production or TestFlight yet.","source":"5.56.10","suppressTypingBefore":true,"startsWork":{"kind":"work","activity":"Watch Raidio beta checks","workId":"work-9","hideSpeaker":true}},{"kind":"work-complete","completesWork":"work-9"},{"who":"homie","text":"Quick dinner heads-up: your Sushi Deli 3 confirmation estimates pickup around 7:07 tonight at 7986 Armour St. It says $44.68 by card at the pickup counter, so it isn’t marked prepaid","source":"5.56.10","reaction":"👍","reactionId":"sushi"},{"who":"homie","text":"Both post-merge CI runs passed every required check on the first attempt. The beta code is now merged and green; the remaining decision is the audio direction before we publish the station or ship TestFlight","source":"5.56.10"},{"kind":"reaction","target":"sushi"},{"who":"me","text":"Great, please run the tests and benchmark the mini for the base model.","dateLabel":{"text":"Oct 4","datetime":"2026-10-04"},"source":"Reconstructed dialogue for chapter 2"},{"who":"homie","text":"Okay, getting that ready.","suppressTypingBefore":true,"source":"Reconstructed dialogue for chapter 2"},{"kind":"work","activity":"Running tests and benchmarking","workId":"work-base-benchmark"},{"who":"homie","text":"We have a clear answer: this Mini can’t sustain continuous Base generation with the current implementation, even with those apps closed.\n\nAfter warmup, it took 5.66 seconds to generate 4 seconds of audio: about 71% of the required speed. It needs roughly 42% more throughput just to keep up, plus some safety margin. const log=document.getElementById('messages'),conversation=document.getElementById('conversation');
let shown=0,typingTimer=null,typingGeneration=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
function scrollToLatest(animate=true){requestAnimationFrame(()=>conversation.scrollTo({top:conversation.scrollHeight,behavior:animate&&!reduced.matches?'smooth':'instant'}))}
function paragraph(text,cls){const el=document.createElement('div');el.className=cls;el.textContent=text;return el}
function speaker(who){const label=document.createElement('div');label.className='speaker';if(who==='homie'){const img=document.createElement('img');img.src=avatar;img.className='speaker-avatar';img.alt='';label.append(img)}label.append(document.createTextNode(who==='me'?'Me':'Homie'));return label}
function messageBubble(m){const bubble=document.createElement('div');bubble.className='bubble';if(m.reaction){bubble.dataset.reaction=m.reaction;bubble.dataset.reactionId=m.reactionId}const at=m.mention?m.text.indexOf(m.mention):-1;if(at<0){bubble.textContent=m.text}else{const mention=document.createElement('span');mention.className='mention';mention.textContent=m.mention;bubble.append(document.createTextNode(m.text.slice(0,at)),mention,document.createTextNode(m.text.slice(at+m.mention.length)))}return bubble}
function activityTab(step){const tab=document.createElement('div');tab.className='activity running';tab.dataset.work=step.workId;tab.dataset.state='running';tab.setAttribute('aria-label',step.activity+' in progress');const status=paragraph('','work-status');status.setAttribute('aria-hidden','true');tab.append(status,paragraph(step.activity,'work-title'));return tab}
function completeWork(id){const tab=Array.from(log.querySelectorAll('.activity')).find(el=>el.dataset.work===id);if(!tab)return;tab.className='activity complete';tab.dataset.state='complete';tab.querySelector('.work-status').textContent='✓';tab.setAttribute('aria-label',tab.querySelector('.work-title').textContent+' complete')}
function appendDate(label,index,animate){const date=document.createElement('time');date.className='date chapter-date'+(animate?' new':'');date.textContent=label.text;date.setAttribute('datetime',label.datetime);date.dataset.index=index;log.append(date)}
function appendWork(m,index,animate){const row=document.createElement('div');row.className='work-row'+(animate?' new':'');row.dataset.index=index;if(!m.hideSpeaker)row.append(speaker('homie'));row.append(activityTab(m));log.append(row)}
function renderStep(index,animate=true){const m=steps[index];if(m.kind==='reaction')return;if(m.kind==='date'){appendDate(m,index,animate);return}if(m.dateLabel)appendDate(m.dateLabel,index,animate);if(m.kind==='work-complete'){completeWork(m.completesWork);return}if(m.kind==='connection'){const el=paragraph(m.text,'connection'+(animate?' new':''));el.dataset.index=index;log.append(el);return}if(m.kind==='work'){appendWork(m,index,animate);return}if(m.completesWork)completeWork(m.completesWork);const article=document.createElement('article');article.className='message '+m.who+(m.special?' special':'')+(m.startsWork?' with-work':'')+(animate?' new':'');article.setAttribute('aria-label',m.who==='me'?'Me':'Homie');article.dataset.index=index;if(!m.completesWork)article.append(speaker(m.who));article.append(messageBubble(m));log.append(article);if(m.startsWork)appendWork(m.startsWork,index,animate)}
function update(){const complete=shown>=steps.length;const reactedTargets=new Set(steps.slice(0,shown).filter(step=>step.kind==='reaction').map(step=>step.target));document.getElementById('back').disabled=shown<=1;const nextButton=document.getElementById('next');document.getElementById('next-label').textContent=complete?'':'Continue…';nextButton.disabled=complete;nextButton.setAttribute('aria-label',complete?'Conversation complete':'Continue conversation');nextButton.querySelector('.arrow').style.visibility=complete?'hidden':'visible';log.querySelectorAll('.bubble[data-reaction]').forEach(bubble=>{const existing=bubble.querySelector('.reaction');const visible=reactedTargets.has(bubble.dataset.reactionId);if(visible&&!existing){const reaction=paragraph(bubble.dataset.reaction,'reaction');reaction.setAttribute('role','img');reaction.setAttribute('aria-label','Thumbs up reaction');bubble.append(reaction)}else if(!visible&&existing){existing.remove()}});document.title='Homie · Raidio';}
function clearTyping(){typingGeneration++;if(typingTimer!==null)clearTimeout(typingTimer);typingTimer=null;document.querySelector('.typing')?.remove()}
function showTyping(){const typing=document.createElement('div');typing.className='message homie typing';typing.setAttribute('aria-hidden','true');typing.append(speaker('homie'));const bubble=document.createElement('div');bubble.className='bubble';for(let i=0;i<3;i++){const dot=document.createElement('span');dot.className='dot';bubble.append(dot)}typing.append(bubble);log.append(typing);scrollToLatest()}
function prepareNext(){clearTyping();const upcoming=steps[shown],prior=steps[shown-1];const needsTyping=upcoming&&upcoming.who==='homie'&&!upcoming.suppressTypingBefore&&!prior.suppressNextTyping&&prior.kind!=='work'&&prior.kind!=='work-complete';if(needsTyping){if(prior.typingDelay){const token=typingGeneration;typingTimer=setTimeout(()=>{if(token!==typingGeneration)return;typingTimer=null;showTyping()},prior.typingDelay)}else{showTyping()}}update()}
function start(){clearTyping();log.replaceChildren();shown=1;renderStep(0,false);prepareNext();conversation.scrollTop=0}
function next(){if(shown>=steps.length)return;clearTyping();renderStep(shown,!reduced.matches);shown++;prepareNext();scrollToLatest()}
function back(){if(shown<=1)return;clearTyping();shown--;log.replaceChildren();for(let i=0;i<shown;i++)renderStep(i,false);prepareNext();scrollToLatest(false)}
function notice(text){const n=document.getElementById('notice');n.textContent=text;n.hidden=false;setTimeout(()=>n.hidden=true,3500)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notice('Use your browser’s full-screen view to present.')}}
document.getElementById('next').addEventListener('click',next);document.getElementById('back').addEventListener('click',back);document.getElementById('reset').addEventListener('click',start);document.getElementById('fullscreen').addEventListener('click',fullscreen);
conversation.addEventListener('click',e=>{if(e.target.closest('a,button')||window.getSelection()?.toString())return;next()});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest('button,input,textarea')&&(e.key===' '||e.key==='Enter'))return;if([' ','ArrowRight','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='f'){fullscreen()}});
start();
</script></body></html>
